<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · Reach Your Peak</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6fb; color: #0b1020; }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
      p { color: #4a5470; line-height: 1.5; }
      button { margin-top: 1rem; font: inherit; font-weight: 600; color: #fff; background: #1565c0; border: 0; border-radius: 999px; padding: 0.7rem 1.4rem; min-height: 44px; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f29a1d; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) { body { background: #0b1020; color: #eef1f8; } p { color: #aab3c8; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Reach Your Peak needs a connection. Check your Wi-Fi or data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
